<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onset | Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
</head>

<body>

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="logo">
      <span class="logo-text">ONSET.</span>
    </div>
    <div class="header-stats">
      <!-- Productivity Tile -->
      <div class="quick-stat stat-mint">
        <div class="stat-dial">85%</div>
        <span class="stat-label">Productivity</span>
      </div>
      <!-- Progress Tile -->
      <div class="quick-stat stat-purple" id="progressToggle">
        <div class="stat-bar-icon">
          <div class="bar-fill" style="width: 60%;"></div>
        </div>
        <span class="stat-label">Progress</span>
      </div>
    </div>
  </header>

  <!-- ================= ACCORDION DRAWER ================= -->
  <div class="progress-drawer" id="progressDrawer">
    <div class="drawer-header">SYLLABUS STATUS</div>
    <div class="drawer-content">
      <div class="syllabus-item">
        <span>Mathematics - Algebra</span>
        <span class="status-done">Completed</span>
      </div>
      <div class="syllabus-item">
        <span>Physics - Kinematics</span>
        <span class="status-pending">Remaining</span>
      </div>
      <div class="syllabus-item">
        <span>Chemistry - Organic</span>
        <span class="status-pending">Remaining</span>
      </div>
    </div>
  </div>

  <main class="main-content">

    <!-- ================= CONSISTENCY TRACKER ================= -->
    <section class="tracker-section">
      <div class="brutalist-container tracker-container">
        <div class="tracker-header">
          <h2 class="section-title" style="margin-bottom: 0;">CONSISTENCY TRACKER</h2>
          <div class="calendar-controls">
            <button class="btn" id="prevMonthBtn">←</button>
            <h3 class="current-month" id="currentMonthDisplay">March 2026</h3>
            <button class="btn" id="nextMonthBtn">→</button>
          </div>
        </div>

        <div class="calendar-strip" id="calendarDaysGrid">
          <!-- JS will populate calendar days horizontally -->
        </div>
      </div>
    </section>

    <!-- ================= TASK MANAGEMENT ================= -->
    <section class="tasks-section">
      <div class="section-header">
        <h2 class="section-title">ACTIVE PLANS</h2>
        <button class="btn btn-primary" onclick="window.location.href='input.html'">+ NEW PLAN</button>
      </div>

      <!-- Empty State -->
      <div class="empty-state" id="emptyStateContainer" style="display: none;">
        <div class="empty-icon">+</div>
        <div class="empty-text">NO ACTIVE PLANS</div>
        <p style="margin-top: 1rem; color: #888;">Create a plan to launch execution protocols.</p>
        <button class="btn btn-black" onclick="window.location.href='input.html'" style="margin-top: 2rem;">CREATE PLAN</button>
      </div>

      <!-- Active Task Grid -->
      <div class="task-grid" id="taskGrid" style="display: none;">
      </div>
    </section>

  </main>

  <script src="script.js"></script>
  <script src="home.js"></script>
</body>

</html>
